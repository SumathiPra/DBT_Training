version: 2
 
models:
  - name: stg_customers
    description : "{{doc('stg_customers_desc')}}"
    columns:
      - name: customer_id
        description: "{{doc('stg_customerid_desc')}}"
        tests:
          - unique
          - not_null

  - name: stg_products
    description : "product for each "
    columns:
      - name: productid
        description: Identify each product uniquely in products master data
        tests:
          - unique
          - not_null

  - name: stg_employees
    description: employee master data for loaded from raw_employees 
    columns:
      - name: empid
        description: unique identifier for each employee
        tests:
          - unique
          - not_null
  
  - name: stg_shipments
    description: shipments data for orders loaded from raw shipment
    columns:
      - name: status
        description: current shipment status for each order placed in order table
        tests:
          - accepted_values:
              values: ['shipped', 'returned', 'ordered', 'replaced']
 
  - name: stg_order_details
    description: detailed orders info maintained for parent orders table
    columns:
      - name: orderid
        description: order id represents each order placed by every customer
        tests:
          - relationships:
              field: orderid
              to: ref('stg_orders')
 